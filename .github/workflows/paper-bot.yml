name: Paper bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min at off-peak minutes (GitHub drops runs at :00/:15/:30/:45 when busy)
  workflow_dispatch: {}        # "Run workflow" button; also how each run starts the next one
  push:
    branches: [main]
    paths: [".github/workflows/paper-bot.yml"]   # restart the loop when this file changes

permissions:
  contents: write
  actions: write     # lets a run start the next run (self-scheduling loop)

concurrency:
  group: paper-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPERBOT_DATA: ${{ github.workspace }}/docs
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Log funding rates
        run: python bot/funding_logger.py
      - name: Run paper strategies (PAPER ONLY, no orders)
        run: |
          python bot/paper_bot.py
          PAPERBOT_DATA="$PAPERBOT_DATA/strat_A2" PAPERBOT_NAME=A2 PAPERBOT_TP=0.04 PAPERBOT_START=5000 PAPERBOT_RISK=0.025 PAPERBOT_CAP=0.075 python bot/paper_bot.py
          PAPERBOT_DATA="$PAPERBOT_DATA/strat_S" PAPERBOT_NAME=S PAPERBOT_SIDES=short PAPERBOT_START=5000 PAPERBOT_RISK=0.025 PAPERBOT_CAP=0.075 python bot/paper_bot.py
          PAPERBOT_DATA="$PAPERBOT_DATA/strat_T" PAPERBOT_NAME=T PAPERBOT_SIDES=both PAPERBOT_LONGFILTER=1 PAPERBOT_START=5000 PAPERBOT_RISK=0.025 PAPERBOT_CAP=0.075 python bot/paper_bot.py
          PAPERBOT_DATA="$PAPERBOT_DATA/strat_L" PAPERBOT_NAME=L PAPERBOT_SIDES=long PAPERBOT_LONGFILTER=1 PAPERBOT_START=5000 PAPERBOT_RISK=0.025 PAPERBOT_CAP=0.075 python bot/paper_bot.py
          python bot/paper_multi.py
      - name: Save state and pages
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "paper bot update $(date -u +'%Y-%m-%d %H:%M UTC')" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Start the next run in ~15 minutes (keeps the bot going without GitHub's cron)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 840
          gh workflow run paper-bot.yml --ref main -R "${{ github.repository }}"
